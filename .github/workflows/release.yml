name: Build PyCharm CentOS7 Release

on:
  workflow_dispatch:
    inputs:
      pycharm_version:
        description: 'PyCharm version to build (default: latest official)'
        required: false
        default: latest
      jbr_release:
        description: 'JBR release tag from jchanghong023/JetBrainsRuntime (default: latest)'
        required: false
        default: latest
      create_release:
        description: 'Create a GitHub Release (true/false)'
        required: false
        default: 'true'
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: pycharm-centos7-release
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends binutils unzip zstd

      - name: Build and validate PyCharm CentOS7 package
        env:
          PYCHARM_VERSION: ${{ inputs.pycharm_version || 'latest' }}
          JBR_RELEASE: ${{ inputs.jbr_release || 'latest' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash scripts/build_pycharm_centos7.sh \
            --version "$PYCHARM_VERSION" \
            --jbr-release "$JBR_RELEASE"

      - name: Compute release metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          tgz="$(basename "$(ls dist/pycharm-*-centos7.tar.gz | head -1)")"
          version="$(printf '%s' "$tgz" | sed -E 's/^pycharm-(.+)-centos7\.tar\.gz$/\1/')"
          echo "tgz=$tgz" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=pycharm-$version-centos7-${{ github.run_id }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        if: github.event_name == 'push' || inputs.create_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: "PyCharm ${{ steps.meta.outputs.version }} (CentOS 7) #${{ github.run_number }}"
          body: |
            PyCharm **${{ steps.meta.outputs.version }}** packaged to run directly on **CentOS 7 / glibc 2.17**.

            Included compatibility changes:
            - CentOS 7 compatible JBR from [jchanghong023/JetBrainsRuntime](https://github.com/jchanghong023/JetBrainsRuntime/releases).
            - Private GCC 13.2 `libstdc++.so.6` + `libgcc_s.so.1` bundled inside PyCharm.
            - `bin/pycharm.sh` prepends that private runtime, so an old GCC 4.8 entry in the user's `LD_LIBRARY_PATH` cannot override it.
            - The newer glibc is **not** bundled; the package keeps the CentOS 7 glibc 2.17 system ABI.
            - The upstream native `bin/pycharm` launcher is replaced with a CentOS 7 compatible shell launcher.

            CI validation includes:
            - pinned SHA256 verification for PyCharm, JBR, and the private GCC runtime packages;
            - private runtime ELF requirement `GLIBC <= 2.17`;
            - required Skiko `GLIBCXX` / `CXXABI` symbol coverage;
            - `bin/pycharm` and `bin/pycharm.sh` startup inside a `centos:7` container while the incoming `LD_LIBRARY_PATH` deliberately points at CentOS 7's old system runtime.

            Usage:
            ```sh
            tar xzf ${{ steps.meta.outputs.tgz }}
            cd pycharm-${{ steps.meta.outputs.version }}
            ./bin/pycharm.sh
            ```

            No GCC module switch and no manual `LD_LIBRARY_PATH` setup should be required.
          files: |
            dist/pycharm-*-centos7.tar.gz
            dist/SHA256SUMS
